[package]
name = "credit-tauri"
version.workspace = true
edition.workspace = true

[dependencies]
credit-core = { path = "../crates/credit-core" }
credit-gateway = { path = "../crates/credit-gateway" }
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true

# regex 用于解析 MiniMax 官网最新版直链
regex = "1"
# winreg 用于检测本机已安装软件（Uninstall 注册表），替代慢的 powershell 子进程
winreg = "0.55"
reqwest = { workspace = true, features = ["json"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
