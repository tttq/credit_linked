[workspace]
resolver = "2"
members = ["crates/credit-core", "crates/credit-cli", "crates/credit-gateway", "crates/credit-ui"]

[workspace.package]
version = "0.1.2"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pem", "jwk", "ecdh"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
dirs = "5"
async-trait = "0.1"
