name: Build CI

# main 分支日常构建检查（Windows x64 编译可用性）。
# 正式发布走 release.yml（git tag vxxx && git push origin vxxx），
# 这里不再监听 tag，避免与 release.yml 重复发版。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p credit-ui

      - name: Rename artifact
        id: name
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if (-not $version) { $version = "0.0.0" }
          $name = "credit-ui-$version-windows-x64.exe"
          Copy-Item target/release/credit-ui.exe $name
          "artifact=$name" | Add-Content $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ steps.name.outputs.artifact }}
          if-no-files-found: error
