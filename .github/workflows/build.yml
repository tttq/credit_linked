name: Build Check

# 仅手动触发（workflow_dispatch）的编译检查：**不打包、不上传任何产物**。
# 正式打包发版只在推送 tag 时执行：git tag v0.1.9 && git push origin v0.1.9（见 release.yml）。
# 日常 push 到 main 不会触发任何构建/打包（一推送就打包已取消）。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 (check only)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build release (check only, no artifact)
        run: cargo build --release -p credit-ui
