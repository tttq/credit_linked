name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin --bundles app,dmg'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage,rpm'
          - platform: 'windows-latest'
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.5 --locked

      - name: Build (credit-tauri)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Linux AppImage 打包在无 FUSE 的 CI 环境需要解包运行 linuxdeploy
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -o pipefail
          cargo tauri build --verbose ${{ matrix.args }} 2>&1 | tee build.log || {
            echo "=== ERROR LINES ==="
            grep -nE "error(\[E[0-9]+\])?:|error\[|panicked|failed to" build.log | tail -n 60 | while IFS= read -r line; do echo "::error::$line" ; done || true
            echo "=== RAW TAIL ==="
            tail -n 200 build.log | while IFS= read -r line; do echo "::error::$line" ; done || true
            exit 1
          }
      - name: Release (tauri-action)
        if: success()
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'AI路由助手 ${{ github.ref_name }}'
          releaseBody: '多平台桌面版：Windows (NSIS exe/msi)、macOS (dmg, Intel/Apple Silicon)、Linux (deb/AppImage)。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
