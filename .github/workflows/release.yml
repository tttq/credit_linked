name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin --bundles app,dmg'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage,rpm'
          - platform: 'windows-latest'
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Sync app version with git tag (vX.Y.Z → tauri.conf.json / Cargo.toml)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "Syncing version to $VER"
          # tauri.conf.json: 只替换第一处 "version"
          node -e "
            const fs = require('fs');
            const f = 'src-tauri/tauri.conf.json';
            const j = JSON.parse(fs.readFileSync(f, 'utf8'));
            j.version = process.argv[1];
            fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
          " "$VER"
          # Cargo.toml workspace.package.version（credit-tauri 继承 workspace 版本，CARGO_PKG_VERSION 即应用版本）
          sed -i '0,/^\[workspace.package\]/s//&/' Cargo.toml
          sed -ri "0,/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/s//version = \"$VER\"/" Cargo.toml
          echo "tauri.conf.json version: $(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")"
          echo "Cargo.toml workspace version: $(grep -m1 -A1 '\[workspace.package\]' Cargo.toml | grep version)"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.5 --locked

      - name: Build (credit-tauri)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Linux AppImage 打包在无 FUSE 的 CI 环境需要解包运行 linuxdeploy
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -o pipefail
          cargo tauri build --verbose ${{ matrix.args }} 2>&1 | tee build.log || {
            echo "=== ERROR LINES ==="
            grep -nE "error(\[E[0-9]+\])?:|error\[|panicked|failed to" build.log | tail -n 60 | while IFS= read -r line; do echo "::error::$line" ; done || true
            echo "=== RAW TAIL ==="
            tail -n 200 build.log | while IFS= read -r line; do echo "::error::$line" ; done || true
            exit 1
          }
      - name: Release (tauri-action)
        if: success()
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Free Router ${{ github.ref_name }}'
          releaseBody: '多平台桌面版：Windows (NSIS exe/msi)、macOS (dmg, Intel/Apple Silicon)、Linux (deb/AppImage)。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
