name: Release Build

# 唯一打包入口：推送版本 tag（git tag v0.1.8 && git push origin v0.1.8）触发。
# 1) 把 tag 里的版本号写进 Cargo.toml [workspace.package].version
#    （credit-ui 经 version.workspace = true 继承 → CARGO_PKG_VERSION 即应用版本，
#     应用内“检查更新”用它与 GitHub releases/latest 的 tag 动态比较）
# 2) 各平台编译打包：Windows exe / macOS app(arm64+x64) / Linux 二进制
# 3) 全部产物附加到与该 tag 对应的 GitHub Release
#
# 注意：普通 commit push（含 main）不会触发本工作流，也不会打包任何产物。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ai-free-router-windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ai-free-router-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ai-free-router-macos-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: ai-free-router-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
          key: ${{ matrix.target }}

      - name: Install dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # gpui(Linux/wayland+x11) 编译期依赖：xkbcommon / wayland / fontconfig / freetype
          sudo apt-get install -y build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig1-dev libfreetype-dev

      - name: Sync app version with git tag (vX.Y.Z → Cargo.toml)
        id: ver
        shell: bash
        run: |
          VER=""
          if [[ "${GITHUB_REF_NAME:-}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VER="${BASH_REMATCH[1]}"
          else
            # 兜底：tag 不是 vX.Y.Z 形态时，回退用 Cargo.toml 里现有版本
            VER=$(sed -n '/\[workspace\.package\]/,/^\[/ { s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p; }' Cargo.toml | head -n1)
          fi
          if [ -z "$VER" ]; then echo "cannot resolve app version"; exit 1; fi
          echo "Packing version: $VER"
          # Cargo.toml workspace.package.version（credit-ui 继承 workspace 版本，CARGO_PKG_VERSION 即应用版本）
          # macOS 的 BSD sed 与 GNU sed 不兼容，统一用 node 跨平台替换
          node -e "
            const fs = require('fs');
            const f = 'Cargo.toml';
            const ver = process.argv[1];
            const lines = fs.readFileSync(f, 'utf8').split('\n');
            let inSection = false, done = false;
            for (let i = 0; i < lines.length; i++) {
              if (/^\[/.test(lines[i])) { inSection = lines[i].trim() === '[workspace.package]'; continue; }
              if (inSection && !done && /^version\s*=/.test(lines[i])) {
                lines[i] = 'version = \"' + ver + '\"';
                done = true;
              }
            }
            if (!done) { console.error('version under [workspace.package] not found'); process.exit(1); }
            fs.writeFileSync(f, lines.join('\n'));
            console.log('Cargo.toml workspace.version -> ' + ver);
          " "$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build (credit-ui)
        run: cargo build --release --target ${{ matrix.target }} -p credit-ui

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          cp "target/x86_64-pc-windows-msvc/release/credit-ui.exe" "AI Free Router-${VER}-windows-x64.exe"
          ls -la "AI Free Router-${VER}-windows-x64.exe"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) ARCH=arm64 ;;
            *) ARCH=x64 ;;
          esac
          APP="AI Free Router.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/credit-ui" "$APP/Contents/MacOS/credit-ui"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>AI Free Router</string>
            <key>CFBundleDisplayName</key><string>AI Free Router</string>
            <key>CFBundleIdentifier</key><string>com.tttq.credit-linked</string>
            <key>CFBundleExecutable</key><string>credit-ui</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>$VER</string>
            <key>CFBundleShortVersionString</key><string>$VER</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # 本地临时签名，保证可双击启动
          codesign --force --deep --sign - "$APP"
          tar -czf "AI Free Router-${VER}-macos-${ARCH}.tar.gz" "$APP"
          ls -la "AI Free Router-${VER}-macos-${ARCH}.tar.gz"

      - name: Package (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p pkg
          cp "target/x86_64-unknown-linux-gnu/release/credit-ui" pkg/credit-ui
          chmod +x pkg/credit-ui
          tar -czf "AI Free Router-${VER}-linux-x64.tar.gz" -C pkg credit-ui
          ls -la "AI Free Router-${VER}-linux-x64.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            AI Free Router-*.exe
            AI Free Router-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach assets to tag Release
        uses: softprops/action-gh-release@v2
        with:
          # tag 推送触发时自动使用当前 tag 创建/复用 Release
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
