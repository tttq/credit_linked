[package]
name = "credit-ui"
build = "build.rs"
version.workspace = true
edition.workspace = true

[[bin]]
name = "credit-ui"
path = "src/main.rs"

[dependencies]
credit-core = { path = "../credit-core" }
credit-gateway = { path = "../credit-gateway" }
gpui-kit = "0.10.0"
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
reqwest = { workspace = true, features = ["json"] }
regex = "1"
rust-embed = "8"
backtrace = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# 主窗口去掉 WS_MAXIMIZEBOX（取消双击标题栏全屏/最大化）+ 右下角托盘图标
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"
